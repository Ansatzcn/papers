<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pages</title>
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.23.0/dist/index.min.js">
    </script>
    <style>
        /* 完整的样式代码 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f7fa;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
            padding: 2rem 1.8rem;
            transition: 0.2s;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #1e293b;
            letter-spacing: -0.5px;
            border-bottom: 2px solid #e9edf4;
            padding-bottom: 0.6rem;
            margin-bottom: 1.8rem;
        }
        .cloud-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #475569;
            padding: 0.3rem 1rem;
            background: #f1f5f9;
            border-radius: 40px;
            float: right;
            margin-top: -2.8rem;
        }
        .cloud-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .cloud-status .dot.online {
            background: #22c55e;
        }
        .cloud-status .dot.offline {
            background: #ef4444;
        }
        .cloud-status .dot.syncing {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e9edf4;
            padding-bottom: 1rem;
        }
        .toolbar .left-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar .right-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar .btn-outline {
            background: transparent;
            border: 1px solid #d1d9e6;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .toolbar .btn-outline:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .toolbar .btn-primary-outline {
            background: #1e293b;
            border: 1px solid #1e293b;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .toolbar .btn-primary-outline:hover {
            background: #0f172a;
        }
        .toolbar .btn-sync {
            background: #2563eb;
            border: 1px solid #2563eb;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .toolbar .btn-sync:hover {
            background: #1d4ed8;
        }
        .toolbar .btn-sync:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .add-section {
            background: #f8fafc;
            border-radius: 24px;
            padding: 1.6rem 1.5rem;
            margin-bottom: 2.2rem;
            border: 1px solid #e2e8f0;
        }
        .add-section h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #0f172a;
            margin-bottom: 1rem;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem 1.2rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #475569;
        }
        .form-group input,
        .form-group textarea {
            background: white;
            border: 1px solid #d1d9e6;
            border-radius: 16px;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            transition: 0.2s;
            font-family: inherit;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: 2px solid #7c9bff;
            border-color: transparent;
            box-shadow: 0 0 0 3px rgba(124, 155, 255, 0.2);
        }
        .form-group textarea {
            min-height: 60px;
        }
        .form-group .hint {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 4px;
        }
        .btn-primary {
            grid-column: 1 / -1;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 0.85rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0.4rem;
        }
        .btn-primary:hover {
            background: #0f172a;
            transform: scale(0.98);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e9edf4;
            margin-top: 0.5rem;
        }
        .page-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .page-table th {
            background: #f1f5f9;
            text-align: left;
            padding: 0.9rem 1.2rem;
            font-weight: 600;
            color: #1e293b;
            border-bottom: 2px solid #d1d9e6;
            white-space: nowrap;
        }
        .page-table th.sortable {
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }
        .page-table th.sortable:hover {
            background: #e2e8f0;
        }
        .page-table th.sortable .sort-icon {
            margin-left: 6px;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .page-table td {
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid #eef2f6;
            vertical-align: middle;
            line-height: 1.5;
        }
        .page-table tbody tr:hover {
            background: #fafcff;
        }
        .page-table tbody tr:last-child td {
            border-bottom: none;
        }
        .page-table .col-title {
            min-width: 200px;
            vertical-align: top;
            -webkit-user-select: text;
            user-select: text;
        }

        /* 总表优先保证文字可选择：标题、提要、备注都允许正常鼠标拖选 */
        .page-table .col-title > a,
        .page-table .title-note,
        .page-table .title-remark {
            -webkit-user-select: text;
            user-select: text;
            cursor: text;
        }

        /* 禁止浏览器把链接当成可拖拽对象，否则会和“选择链接文字”冲突 */
        .page-table .col-title > a {
            -webkit-user-drag: none;
        }

        .page-table .col-title a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }
        .page-table .col-title a:hover {
            text-decoration: underline;
        }
        .page-table .title-note,
        .page-table .title-remark {
            margin-top: 0.28rem;
            color: #64748b;
            font-size: 0.86rem;
            font-weight: 400;
            line-height: 1.45;
            white-space: normal;
            overflow-wrap: anywhere;
        }
        .page-table .title-footer {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 0.32rem;
            min-height: 1.5rem;
        }
        .page-table .title-footer .title-remark {
            flex: 1 1 auto;
            min-width: 0;
            margin-top: 0;
        }
        .page-table .row-edit-link {
            flex: 0 0 auto;
            align-self: flex-end;
            border: none;
            background: transparent;
            color: #2563eb;
            padding: 0;
            font: inherit;
            font-size: 0.86rem;
            font-weight: 500;
            line-height: 1.45;
            cursor: pointer;
            text-decoration: none;
        }
        .page-table .row-edit-link:hover,
        .page-table .row-edit-link:focus-visible {
            color: #1d4ed8;
            text-decoration: underline;
            outline: none;
        }
        .empty-row td {
            padding: 2.5rem 1rem;
            text-align: center;
            color: #94a3b8;
            font-size: 1rem;
            background: #fafcff;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 1.8rem 0 0.8rem 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .list-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #0f172a;
        }
        .list-header .badge {
            background: #e9edf4;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #334155;
        }


        /* 编辑弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal-box {
            background: white;
            border-radius: 28px;
            padding: 2rem 2rem 1.8rem;
            max-width: 520px;
            width: 92%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.25s ease;
        }
        .modal-box h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.2rem;
        }
        .modal-box .modal-sub {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #e9edf4;
            padding-bottom: 0.8rem;
        }
        .modal-box .form-group {
            margin-bottom: 1rem;
        }
        .modal-box .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #475569;
        }
        .modal-box .form-group input,
        .modal-box .form-group textarea {
            width: 100%;
            background: white;
            border: 1px solid #d1d9e6;
            border-radius: 14px;
            padding: 0.6rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .modal-box .form-group input:focus,
        .modal-box .form-group textarea:focus {
            outline: 2px solid #7c9bff;
            border-color: transparent;
        }
        .modal-box .form-group textarea {
            min-height: 56px;
            resize: vertical;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.2rem;
        }
        .modal-actions-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .modal-actions .btn-modal {
            padding: 0.5rem 1.6rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.15s;
        }
        .modal-actions .btn-modal.cancel {
            background: #f1f5f9;
            color: #334155;
        }
        .modal-actions .btn-modal.cancel:hover {
            background: #e2e8f0;
        }
        .modal-actions .btn-modal.save {
            background: #1e293b;
            color: white;
        }
        .modal-actions .btn-modal.save:hover {
            background: #0f172a;
        }
        .modal-actions .btn-modal.delete {
            background: #fee2e2;
            color: #991b1b;
        }
        .modal-actions .btn-modal.delete:hover {
            background: #fecaca;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Toast 消息 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.8rem 2rem;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            font-size: 0.9rem;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            background: #1e293b;
            max-width: 90%;
            text-align: center;
        }
        .toast.success {
            background: #16a34a;
        }
        .toast.error {
            background: #dc2626;
        }
        .toast.info {
            background: #2563eb;
        }
        .toast.hidden {
            display: none;
        }

        /* 配置弹窗 */
        .config-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.25s ease;
            padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
            overflow: hidden;
        }
        .config-overlay.hidden {
            display: none;
        }
        .config-box {
            background: white;
            border-radius: 28px;
            padding: 2rem 2rem 1.2rem;
            max-width: 560px;
            width: min(94%, 560px);
            max-height: calc(100vh - 24px);
            max-height: calc(100dvh - max(24px, env(safe-area-inset-top) + env(safe-area-inset-bottom) + 16px));
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-gutter: stable;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.25s ease;
        }
        .config-box::-webkit-scrollbar {
            width: 8px;
        }
        .config-box::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
        }
        .config-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .config-box h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }
        .config-box .config-desc {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #e9edf4;
            padding-bottom: 0.8rem;
        }
        .config-box .form-group {
            margin-bottom: 1rem;
        }
        .config-box .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #475569;
        }
        .config-box .form-group input {
            width: 100%;
            background: white;
            border: 1px solid #d1d9e6;
            border-radius: 14px;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .config-box .form-group input:focus {
            outline: 2px solid #7c9bff;
            border-color: transparent;
        }
        .config-box .form-group .hint {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 4px;
        }
        .config-box .form-group .hint a {
            color: #2563eb;
            text-decoration: none;
        }
        .config-box .form-group .hint a:hover {
            text-decoration: underline;
        }
        .config-box .token-save-option {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            color: #475569;
            font-size: 0.82rem;
            font-weight: 500;
            text-transform: none;
            letter-spacing: 0;
            cursor: pointer;
        }
        .config-box .token-save-option input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0;
            padding: 0;
            accent-color: #2563eb;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .config-box .token-save-hint {
            margin-left: 24px;
            color: #64748b;
            line-height: 1.5;
        }
        .config-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 1.2rem;
            position: sticky;
            bottom: 0;
            z-index: 3;
            background: linear-gradient(to bottom, rgba(255,255,255,0.88), #fff 24%);
            padding: 0.9rem 0 max(0.2rem, env(safe-area-inset-bottom));
        }
        .config-actions .btn-config {
            padding: 0.5rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.15s;
        }
        .config-actions .btn-config.primary {
            background: #1e293b;
            color: white;
        }
        .config-actions .btn-config.primary:hover {
            background: #0f172a;
        }
        .config-actions .btn-config.secondary {
            background: #f1f5f9;
            color: #334155;
        }
        .config-actions .btn-config.secondary:hover {
            background: #e2e8f0;
        }

        /* 回到顶部悬浮按钮 */
        .back-to-top {
            position: fixed;
            right: 16px;
            top: 80%;
            transform: translateY(-50%);
            z-index: 900;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            padding: 0;
            border: 1px solid rgba(148, 163, 184, 0.65);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.82);
            color: #64748b;
            font-family: inherit;
            font-size: 0.78rem;
            line-height: 1;
            cursor: pointer;
            opacity: 0.72;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(6px);
            transition: opacity 0.2s, background 0.2s, color 0.2s, transform 0.2s;
        }
        .back-to-top:hover,
        .back-to-top:focus-visible {
            opacity: 1;
            background: rgba(255, 255, 255, 0.98);
            color: #334155;
            transform: translateY(calc(-50% - 2px));
            outline: none;
        }
        .back-to-top .back-to-top-icon {
            font-size: 0.78rem;
        }

        @media (max-width: 700px) {
            body {
                width: 100%;
                max-width: 100%;
                padding: 0.75rem 0.5rem;
                overflow-x: hidden;
            }
            .container {
                width: 100%;
                max-width: 100%;
                min-width: 0;
                padding: 1.2rem;
            }
            .table-wrapper {
                width: 100%;
                max-width: 100%;
                min-width: 0;
                overflow-x: hidden;
            }
            .page-table {
                width: 100%;
                max-width: 100%;
                min-width: 0;
                table-layout: fixed;
            }
            .page-table th,
            .page-table td,
            .page-table .col-title {
                width: 100%;
                max-width: 100%;
                min-width: 0;
            }
            .page-table .col-title {
                overflow-wrap: anywhere;
                word-break: break-word;
            }
            .page-table .col-title > a {
                display: inline;
                max-width: 100%;
                overflow-wrap: anywhere;
                word-break: break-all;
            }
            .page-table .title-note,
            .page-table .title-remark {
                max-width: 100%;
                overflow-wrap: anywhere;
                word-break: break-word;
            }
            .page-table .title-footer {
                width: 100%;
                max-width: 100%;
                min-width: 0;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .page-table th,
            .page-table td {
                padding: 0.6rem 0.8rem;
                font-size: 0.85rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .left-group,
            .toolbar .right-group {
                justify-content: center;
            }
            .cloud-status {
                float: none;
                margin-top: 0;
            }
            .config-overlay {
                align-items: stretch;
                padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
            }
            .config-box {
                width: 100%;
                max-height: calc(100dvh - max(16px, env(safe-area-inset-top) + env(safe-area-inset-bottom) + 8px));
                margin: auto 0;
                padding: 1.25rem 1rem 0.8rem;
                border-radius: 22px;
            }
            .config-actions {
                gap: 8px;
            }
            .config-actions .btn-config {
                flex: 1 1 0;
                min-width: 0;
                padding-left: 0.75rem;
                padding-right: 0.75rem;
            }
            .back-to-top {
                right: 3px;
                top: 80%;
                width: 24px;
                height: 24px;
                padding: 0;
                font-size: 0.68rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            Pages
            <span class="cloud-status" id="cloudStatus">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">未配置</span>
            </span>
        </h1>

        <div class="toolbar">
            <div class="left-group">

    <!-- Toast 消息 -->
    <div class="toast hidden" id="toast"></div>

    <script>
        (function() {
            // 配置存储键名
            const CONFIG_KEY = 'pages_github_config';
            const TOKEN_LOCAL_KEY = 'pages_github_token_local';
            const TOKEN_SESSION_KEY = 'pages_github_token_session';
            const STORAGE_KEY = 'pages_data';

            // 全局状态
            let pages = [];
            let editingIndex = null;
            let isSyncing = false;

            let config = {
                token: '',
                rememberToken: true,
                owner: '',
                repo: '',
                file: 'pages_data.json'
            };

            // DOM 引用
            const pageInput = document.getElementById('pageInput');
            const noteInput = document.getElementById('noteInput');
            const remarkInput = document.getElementById('remarkInput');
            const addBtn = document.getElementById('addBtn');
            const tableBody = document.getElementById('tableBody');
            const countDisplay = document.getElementById('countDisplay');
            const exportBtn = document.getElementById('exportBtn');
            const importBtn = document.getElementById('importBtn');
            const fileInput = document.getElementById('fileInput');
            const syncBtn = document.getElementById('syncBtn');
            const lastSyncTime = document.getElementById('lastSyncTime');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const configBtn = document.getElementById('configBtn');
            const backToTopBtn = document.getElementById('backToTopBtn');

            const editModal = document.getElementById('editModal');
            const editTitleDisplay = document.getElementById('editTitleDisplay');
            const editPageInput = document.getElementById('editPageInput');
            const editNoteInput = document.getElementById('editNoteInput');
            const editRemarkInput = document.getElementById('editRemarkInput');
            const editDeleteBtn = document.getElementById('editDeleteBtn');
            const editCancelBtn = document.getElementById('editCancelBtn');
            const editSaveBtn = document.getElementById('editSaveBtn');

            const configModal = document.getElementById('configModal');
            const cfgToken = document.getElementById('cfgToken');
            const cfgRememberToken = document.getElementById('cfgRememberToken');
            const cfgOwner = document.getElementById('cfgOwner');
            const cfgRepo = document.getElementById('cfgRepo');
            const cfgFile = document.getElementById('cfgFile');
            const configCancelBtn = document.getElementById('configCancelBtn');
            const configSaveBtn = document.getElementById('configSaveBtn');

            const toast = document.getElementById('toast');
            let toastTimer = null;

            // ============================================================
            //  排序工具函数
            // ============================================================
            // 显式使用拼音校对规则：中文标题按拼音首字母及后续完整拼音排序。
            // numeric: true 使 Page2 排在 Page10 前；ignorePunctuation 减少标点对主排序的干扰。
            const pinyinCollator = new Intl.Collator('zh-CN-u-co-pinyin', {
                usage: 'sort',
                sensitivity: 'base',
                numeric: true,
                ignorePunctuation: true
            });
            const generalCollator = new Intl.Collator('zh-CN', {
                usage: 'sort',
                sensitivity: 'base',
                numeric: true,
                ignorePunctuation: true
            });
            const strokeCollator = new Intl.Collator('zh-CN-u-co-stroke', {
                usage: 'sort',
                sensitivity: 'variant',
                numeric: true
            });

            function normalizeSortText(value) {
                return typeof value === 'string'
                    ? value.normalize('NFKC').trim()
                    : '';
            }

            function parseExactDateKey(text) {
                const value = normalizeSortText(text);
                const match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
                if (!match) return null;

                const year = Number(match[1]);
                const month = Number(match[2]);
                const day = Number(match[3]);
                const date = new Date(Date.UTC(year, month - 1, day));

                if (
                    date.getUTCFullYear() !== year ||
                    date.getUTCMonth() !== month - 1 ||
                    date.getUTCDate() !== day
                ) {
                    return null;
                }

                return year * 10000 + month * 100 + day;
            }

            function getStructuredSortInfo(value) {
                const text = normalizeSortText(value);
                if (!text) {
                    return { type: 99, text: '', dateKey: null, numberKey: null };
                }

                const dateKey = parseExactDateKey(text);
                if (dateKey !== null) {
                    return { type: 0, text, dateKey, numberKey: null };
                }

                const first = Array.from(text)[0] || '';

                // 汉字：按拼音首字母及后续完整拼音排序。
                if (/^\p{Script=Han}$/u.test(first)) {
                    return { type: 1, text, dateKey: null, numberKey: null };
                }

                // 数字：按开头数值从小到大；日期已在上一步优先识别。
                const numberMatch = text.match(/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)/);
                if (numberMatch) {
                    return {
                        type: 2,
                        text,
                        dateKey: null,
                        numberKey: Number(numberMatch[0])
                    };
                }

                // 拉丁字母：A → Z，不区分大小写。
                if (/^[A-Za-z]$/.test(first)) {
                    return { type: 3, text, dateKey: null, numberKey: null };
                }

                // 未指定的其它符号放在最后。
                return { type: 4, text, dateKey: null, numberKey: null };
            }

            function compareStructuredText(valueA, valueB) {
                const a = getStructuredSortInfo(valueA);
                const b = getStructuredSortInfo(valueB);

                if (a.type !== b.type) {
                    return a.type - b.type;
                }

                if (a.type === 0 && a.dateKey !== b.dateKey) {
                    return a.dateKey - b.dateKey;
                }

                if (a.type === 1) {
                    let result = pinyinCollator.compare(a.text, b.text);
                    if (result !== 0) return result;

                    result = strokeCollator.compare(a.text, b.text);
                    if (result !== 0) return result;
                }

                if (a.type === 2 && a.numberKey !== b.numberKey) {
                    return a.numberKey - b.numberKey;
                }

                if (a.type === 3) {
                    const upperA = a.text.toUpperCase();
                    const upperB = b.text.toUpperCase();
                    const result = upperA.localeCompare(upperB, 'en', {
                        sensitivity: 'base',
                        numeric: true
                    });
                    if (result !== 0) return result;
                }

                const result = generalCollator.compare(a.text, b.text);
                if (result !== 0) return result;

                return a.text < b.text ? -1 : (a.text > b.text ? 1 : 0);
            }

            // ============================================================
            //  总表固定排序规则
            // ============================================================
            function sortPages() {
                pages.sort((a, b) => {
                    const aHasRemark = Boolean(a && typeof a.remark === 'string' && a.remark.trim());
                    const bHasRemark = Boolean(b && typeof b.remark === 'string' && b.remark.trim());

                    // 有备注的条目永远在前。
                    if (aHasRemark !== bHasRemark) {
                        return aHasRemark ? -1 : 1;
                    }

                    // 两条都有备注：只比较备注，完全不考虑标题。
                    if (aHasRemark && bHasRemark) {
                        return compareStructuredText(a.remark, b.remark);
                    }

                    // 两条都没有备注：只比较标题。
                    return compareStructuredText(a && a.title, b && b.title);
                });
            }

            // ============================================================
            //  解析 [标题](链接) 格式
            // ============================================================
            function parsePageInput(input) {
                const raw = String(input || '').trim();

                // [文字](链接)：总表只显示“文字”为蓝色链接，
                // 编辑时仍保留完整的 [文字](链接) 原始格式。
                const match = raw.match(/^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)$/i);
                if (match) {
                    return {
                        title: match[1].trim(),
                        url: match[2].trim(),
                        titleMode: 'markdown'
                    };
                }

                // 直接输入完整网址：总表直接显示网址本身为蓝色链接，
                // 编辑时仍显示原始网址，不转换成 [网址](网址)。
                if (/^https?:\/\/[^\s]+$/i.test(raw)) {
                    return {
                        title: raw,
                        url: raw,
                        titleMode: 'url'
                    };
                }

                return {
                    title: raw,
                    url: '',
                    titleMode: 'text'
                };
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ============================================================
            //  配置管理
            // ============================================================
            function loadConfig() {
                const stored = localStorage.getItem(CONFIG_KEY);
                let parsed = {};
                if (stored) {
                    try {
                        parsed = JSON.parse(stored) || {};
                    } catch (e) {
                        parsed = {};
                    }
                }

                const rememberToken = typeof parsed.rememberToken === 'boolean'
                    ? parsed.rememberToken
                    : true;

                // 兼容旧版本：旧版把 Token 直接存放在 CONFIG_KEY 中。
                if (typeof parsed.token === 'string' && parsed.token.trim()) {
                    if (rememberToken && !localStorage.getItem(TOKEN_LOCAL_KEY)) {
                        localStorage.setItem(TOKEN_LOCAL_KEY, parsed.token.trim());
                    }
                    if (!rememberToken && !sessionStorage.getItem(TOKEN_SESSION_KEY)) {
                        sessionStorage.setItem(TOKEN_SESSION_KEY, parsed.token.trim());
                    }
                }

                config = {
                    token: rememberToken
                        ? (localStorage.getItem(TOKEN_LOCAL_KEY) || '')
                        : (sessionStorage.getItem(TOKEN_SESSION_KEY) || ''),
                    rememberToken,
                    owner: typeof parsed.owner === 'string' ? parsed.owner : '',
                    repo: typeof parsed.repo === 'string' ? parsed.repo : '',
                    file: typeof parsed.file === 'string' && parsed.file.trim()
                        ? parsed.file.trim()
                        : 'pages_data.json'
                };

                cfgToken.value = config.token;
                cfgRememberToken.checked = config.rememberToken;
                cfgOwner.value = config.owner;
                cfgRepo.value = config.repo;
                cfgFile.value = config.file;
                return Boolean(stored || config.token);
            }

            function saveConfig() {
                config.token = cfgToken.value.trim();
                config.rememberToken = cfgRememberToken.checked;
                config.owner = cfgOwner.value.trim();
                config.repo = cfgRepo.value.trim();
                config.file = cfgFile.value.trim() || 'pages_data.json';

                if (config.rememberToken) {
                    localStorage.setItem(TOKEN_LOCAL_KEY, config.token);
                    sessionStorage.removeItem(TOKEN_SESSION_KEY);
                } else {
                    sessionStorage.setItem(TOKEN_SESSION_KEY, config.token);
                    localStorage.removeItem(TOKEN_LOCAL_KEY);
                }

                // Token 单独保存，避免配置 JSON 中长期重复存储明文 Token。
                localStorage.setItem(CONFIG_KEY, JSON.stringify({
                    rememberToken: config.rememberToken,
                    owner: config.owner,
                    repo: config.repo,
                    file: config.file
                }));
            }

            function isConfigValid() {
                return config.token && config.owner && config.repo && config.file;
            }

            // ============================================================
            //  GitHub API
            // ============================================================
            async function githubApi(method, endpoint, body = null) {
                const url = `https://api.github.com/repos/${config.owner}/${config.repo}/${endpoint}`;
                const headers = {
                    'Authorization': `token ${config.token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                };
                const options = { method, headers };
                if (body) {
                    options.body = JSON.stringify(body);
                }
                const response = await fetch(url, options);
                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.message || `HTTP ${response.status}`);
                }
                return response.json();
            }

            async function getFileSha() {
                try {
                    const data = await githubApi('GET', `contents/${config.file}`);
                    return data.sha;
                } catch (e) {
                    if (e.message.includes('404')) return null;
                    throw e;
                }
            }

            async function loadFromGitHub() {
                if (!isConfigValid()) {
                    throw new Error('请先配置 GitHub 连接');
                }
                try {
                    const data = await githubApi('GET', `contents/${config.file}`);
                    const content = data.content;
                    const decoded = decodeURIComponent(escape(atob(content)));
                    return JSON.parse(decoded);
                } catch (e) {
                    if (e.message.includes('404')) return null;
                    throw e;
                }
            }

            // ============================================================
            //  同步函数
            // ============================================================
            async function syncToCloud(showToastMsg = true) {
                if (isSyncing) return;
                if (!isConfigValid()) {
                    showToast('请先点击 "配置" 按钮设置 GitHub 连接', 'error');
                    return;
                }
                if (pages.length === 0) {
                    showToast('没有数据需要同步', 'info');
                    return;
                }

                isSyncing = true;
                syncBtn.disabled = true;
                setCloudStatus('syncing', '同步中...');

                try {
                    let sha = null;
                    try {
                        const res = await fetch(
                            `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.file}`, {
                                headers: { 'Authorization': `token ${config.token}` }
                            });
                        if (res.status === 200) {
                            const data = await res.json();
                            sha = data.sha;
                        }
                    } catch (e) {}

                    const content = btoa(unescape(encodeURIComponent(JSON.stringify(pages, null, 2))));
                    const body = {
                        message: `更新数据 - ${new Date().toLocaleString()}`,
                        content: content
                    };
                    if (sha) body.sha = sha;

                    const res = await fetch(
                        `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.file}`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${config.token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(body)
                        });

                    const result = await res.json();
                    if (res.status === 200 || res.status === 201) {
                        const now = new Date();
                        lastSyncTime.textContent = `已同步 ${now.toLocaleString()}`;
                        if (showToastMsg) {
                            showToast(`成功同步 ${pages.length} 个条目到 GitHub`, 'success');
                        }
                        setCloudStatus('online', '已连接');
                    } else {
                        throw new Error(result.message || '未知错误');
                    }
                } catch (e) {
                    console.error('同步失败:', e);
                    showToast(`同步失败：${e.message}`, 'error');
                    setCloudStatus('offline', '同步失败');
                } finally {
                    isSyncing = false;
                    syncBtn.disabled = false;
                }
            }

            async function loadFromCloud() {
                if (!isConfigValid()) {
                    setCloudStatus('offline', '未配置');
                    loadFromLocal();
                    return;
                }
                setCloudStatus('syncing', '加载中...');

                try {
                    const data = await loadFromGitHub();
                    if (data && Array.isArray(data) && data.length > 0) {
                        pages = data.filter(item => item.title && item.title.trim() !== '');
                        applySortAndRender();
                        const now = new Date();
                        lastSyncTime.textContent = `已同步 ${now.toLocaleString()}`;
                        setCloudStatus('online', '已连接');
                        showToast(`从 GitHub 加载了 ${pages.length} 个条目`, 'success');
                    } else {
                        showToast('云端无数据，从本地加载', 'info');
                        loadFromLocal();
                        if (pages.length > 0) {
                            setTimeout(() => syncToCloud(false), 500);
                        }
                    }
                } catch (e) {
                    console.error('加载云端数据失败:', e);
                    showToast(`加载云端失败：${e.message}，从本地加载`, 'error');
                    loadFromLocal();
                }
            }

            // ============================================================
            //  本地存储
            // ============================================================
            function loadFromLocal() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        pages = JSON.parse(stored);
                        if (!Array.isArray(pages)) pages = [];
                        pages = pages.filter(item => item.title && item.title.trim() !== '');
                    } catch (e) {
                        pages = [];
                    }
                } else {
                    pages = [
                        { title: '10个必知技巧', url: 'https://example.com/10-tips', note: '数字开头示例' },
                        { title: '2个方法', url: 'https://example.com/2-methods', note: '数字开头示例' },
                        { title: 'Apple', url: 'https://apple.com', note: '英文开头' },
                        { title: 'GitHub', url: 'https://github.com', note: '英文开头' },
                        { title: '大', url: 'https://example.com/da', note: '中文 - D' },
                        { title: '丹', url: 'https://example.com/dan', note: '中文 - D' },
                        { title: '东', url: 'https://example.com/dong', note: '中文 - D' },
                        { title: '访问', url: 'https://example.com/visit', note: '中文 - F' },
                        { title: '苹', url: 'https://example.com/ping', note: '中文 - P' }
                    ];
                }
                applySortAndRender();
                saveToLocal();
            }

            function saveToLocal() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(pages));
            }

            // ============================================================
            //  渲染
            // ============================================================
            function applySortAndRender() {
                sortPages();
                renderTable();
                saveToLocal();
            }

            function renderTable() {
                countDisplay.textContent = pages.length;

                if (pages.length === 0) {
                    tableBody.innerHTML = `<tr class="empty-row"><td>列表为空，添加一个吧！</td></tr>`;
                    return;
                }

                let html = '';
                pages.forEach((item, index) => {
                    const title = escapeHtml(item.title || '');
                    const url = escapeHtml(item.url || '');
                    const note = escapeHtml(item.note || '');
                    const remark = escapeHtml(item.remark || '');
                    const displayHtml = url
                        ? `<a href="${url}" target="_blank" rel="noopener noreferrer" draggable="false">${title}</a>`
                        : title;
                    const noteHtml = note
                        ? `<div class="title-note">${note}</div>`
                        : '';
                    const remarkHtml = remark
                        ? `<div class="title-remark">${remark}</div>`
                        : '<div class="title-remark"></div>';

                    html += `
                        <tr data-index="${index}">
                            <td class="col-title">
                                ${displayHtml}
                                ${noteHtml}
                                <div class="title-footer">
                                    ${remarkHtml}
                                    <button class="row-edit-link edit-btn" data-index="${index}" type="button">编辑</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
                tableBody.innerHTML = html;

                // 链接标题需要同时兼顾“单击打开”和“拖动选择文字”。
                // 禁止原生链接拖拽；如果当前确实选中了链接文字，则不要触发跳转。
                document.querySelectorAll('#tableBody .col-title > a').forEach(link => {
                    link.addEventListener('dragstart', function(e) {
                        e.preventDefault();
                    });

                    link.addEventListener('click', function(e) {
                        const selection = window.getSelection();
                        const hasSelectedLinkText =
                            selection &&
                            !selection.isCollapsed &&
                            (this.contains(selection.anchorNode) || this.contains(selection.focusNode));

                        if (hasSelectedLinkText) {
                            e.preventDefault();
                        }
                    });
                });

                document.querySelectorAll('#tableBody .edit-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const index = this.getAttribute('data-index');
                        if (index !== null) {
                            const idx = parseInt(index, 10);
                            if (!isNaN(idx) && idx >= 0 && idx < pages.length) {
                                openEditModal(idx);
                            }
                        }
                    });
                });
            }

            // ============================================================
            //  编辑功能
            // ============================================================
            function openEditModal(index) {
                editingIndex = index;
                const item = pages[index];
                editTitleDisplay.textContent = item.title;
                if (item.url) {
                    // 新数据用 titleMode 精确保留输入形式。
                    // 兼容旧数据：若 title 与 url 完全相同，则按“直接网址”处理。
                    const mode = item.titleMode || (item.title === item.url ? 'url' : 'markdown');
                    editPageInput.value = mode === 'url'
                        ? item.url
                        : `[${item.title}](${item.url})`;
                } else {
                    editPageInput.value = item.title;
                }
                editNoteInput.value = item.note || '';
                editRemarkInput.value = item.remark || '';
                editModal.classList.remove('hidden');
                setTimeout(() => editPageInput.focus(), 100);
            }

            function closeEditModal() {
                editModal.classList.add('hidden');
                editingIndex = null;
            }

            function saveEdit() {
                if (editingIndex === null || editingIndex < 0 || editingIndex >= pages.length) {
                    alert('编辑出错，请重试。');
                    closeEditModal();
                    return;
                }

                const raw = editPageInput.value.trim();
                if (!raw) {
                    alert('请填写 Page 字段。');
                    editPageInput.focus();
                    return;
                }

                const parsed = parsePageInput(raw);
                if (!parsed.title) {
                    alert('请正确填写格式：[标题](链接)');
                    editPageInput.focus();
                    return;
                }

                pages[editingIndex].title = parsed.title;
                pages[editingIndex].url = parsed.url;
                pages[editingIndex].titleMode = parsed.titleMode;
                pages[editingIndex].note = editNoteInput.value.trim();
                pages[editingIndex].remark = editRemarkInput.value.trim();

                closeEditModal();
                applySortAndRender();
                if (isConfigValid()) {
                    syncToCloud(false);
                }
            }

            function deleteEditingEntry() {
                if (editingIndex === null || editingIndex < 0 || editingIndex >= pages.length) {
                    alert('删除出错，请重试。');
                    closeEditModal();
                    return;
                }

                const item = pages[editingIndex];
                if (!confirm(`确定要删除 "${item.title}" 吗？`)) {
                    return;
                }

                pages.splice(editingIndex, 1);
                closeEditModal();
                applySortAndRender();

                if (isConfigValid()) {
                    syncToCloud(false);
                }
            }

            // ============================================================
            //  添加
            // ============================================================
            function addPage() {
                const raw = pageInput.value.trim();
                const note = noteInput.value.trim();
                const remark = remarkInput.value.trim();

                if (!raw) {
                    alert('请填写“标题”字段。');
                    pageInput.focus();
                    return;
                }

                const parsed = parsePageInput(raw);
                if (!parsed.title) {
                    alert('请正确填写格式：[标题](链接)');
                    pageInput.focus();
                    return;
                }

                pages.push({
                    title: parsed.title,
                    url: parsed.url,
                    titleMode: parsed.titleMode,
                    note: note,
                    remark: remark
                });
                applySortAndRender();

                if (isConfigValid()) {
                    syncToCloud(false);
                }

                pageInput.value = '';
                noteInput.value = '';
                remarkInput.value = '';
                pageInput.focus();
            }

            // ============================================================
            //  导出/导入
            // ============================================================
            function exportData() {
                if (pages.length === 0) {
                    alert('列表为空，没有什么可导出的。');
                    return;
                }
                const jsonStr = JSON.stringify(pages, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `pages_backup_${new Date().toISOString().slice(0, 10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('导出成功', 'success');
            }

            function importData(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (!Array.isArray(imported)) {
                            alert('文件格式错误：不是一个有效的列表。');
                            return;
                        }
                        const valid = imported.filter(item => item.title && item.title.trim() !== '');
                        if (valid.length === 0) {
                            alert('文件中没有找到有效的条目。');
                            return;
                        }
                        if (pages.length > 0) {
                            if (!confirm(`当前有 ${pages.length} 个条目，导入将完全替换当前列表。确定继续吗？`)) {
                                return;
                            }
                        }
                        pages = valid;
                        applySortAndRender();
                        showToast(`成功导入 ${pages.length} 个条目`, 'success');
                        if (isConfigValid()) {
                            syncToCloud(false);
                        }
                    } catch (err) {
                        alert('解析文件失败，请确保是有效的 JSON 文件。');
                    }
                };
                reader.readAsText(file);
            }


            // ============================================================
            //  Cloud Status
            // ============================================================
            function setCloudStatus(status, text) {
                statusDot.className = 'dot ' + status;
                statusText.textContent = text;
            }

            // ============================================================
            //  Toast
            // ============================================================
            function showToast(message, type = 'info') {
                toast.textContent = message;
                toast.className = 'toast ' + type;
                toast.classList.remove('hidden');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.add('hidden');
                }, 3000);
            }

            // ============================================================
            //  配置弹窗
            // ============================================================
            function openConfigModal() {
                cfgToken.value = config.token || '';
                cfgRememberToken.checked = config.rememberToken !== false;
                cfgOwner.value = config.owner || '';
                cfgRepo.value = config.repo || '';
                cfgFile.value = config.file || 'pages_data.json';
                configModal.classList.remove('hidden');
                const box = configModal.querySelector('.config-box');
                if (box) box.scrollTop = 0;
                requestAnimationFrame(() => cfgToken.focus({ preventScroll: true }));
            }

            function closeConfigModal() {
                configModal.classList.add('hidden');
            }

            function saveConfigAndConnect() {
                const token = cfgToken.value.trim();
                const owner = cfgOwner.value.trim();
                const repo = cfgRepo.value.trim();
                const file = cfgFile.value.trim() || 'pages_data.json';

                if (!token) {
                    showToast('请输入 GitHub Token', 'error');
                    cfgToken.focus();
                    return;
                }
                if (!owner) {
                    showToast('请输入仓库所有者', 'error');
                    cfgOwner.focus();
                    return;
                }
                if (!repo) {
                    showToast('请输入仓库名称', 'error');
                    cfgRepo.focus();
                    return;
                }

                config.token = token;
                config.owner = owner;
                config.repo = repo;
                config.file = file;
                saveConfig();

                closeConfigModal();
                showToast('配置已保存，正在连接...', 'info');

                loadFromCloud();
            }

            // ============================================================
            //  事件绑定
            // ============================================================
            addBtn.addEventListener('click', addPage);

            document.querySelectorAll('.form-group input, .form-group textarea').forEach(input => {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        if (this.tagName === 'TEXTAREA') {
                            if (e.ctrlKey || e.shiftKey) {
                                e.preventDefault();
                                addPage();
                            }
                        } else {
                            e.preventDefault();
                            addPage();
                        }
                    }
                });
            });
            exportBtn.addEventListener('click', exportData);
            importBtn.addEventListener('click', function() { fileInput.click(); });
            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    importData(this.files[0]);
                    this.value = '';
                }
            });

            syncBtn.addEventListener('click', function() {
                if (pages.length === 0) {
                    showToast('没有数据需要同步', 'info');
                    return;
                }
                syncToCloud(true);
            });

            configBtn.addEventListener('click', openConfigModal);
            backToTopBtn.addEventListener('click', function() {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
            configCancelBtn.addEventListener('click', closeConfigModal);
            configSaveBtn.addEventListener('click', saveConfigAndConnect);

            configModal.addEventListener('click', function(e) {
                if (e.target === this) {
                    closeConfigModal();
                }
            });

            editDeleteBtn.addEventListener('click', deleteEditingEntry);
            editCancelBtn.addEventListener('click', closeEditModal);
            editSaveBtn.addEventListener('click', saveEdit);
            editModal.addEventListener('click', function(e) {
                if (e.target === this) {
                    closeEditModal();
                }
            });

            document.querySelectorAll('#editModal .form-group input, #editModal .form-group textarea').forEach(input => {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        if (this.tagName === 'TEXTAREA') {
                            if (e.ctrlKey || e.shiftKey) {
                                e.preventDefault();
                                saveEdit();
                            }
                        } else {
                            e.preventDefault();
                            saveEdit();
                        }
                    }
                });
            });

            // ============================================================
            //  初始化
            // ============================================================
            loadConfig();
            loadFromCloud();

        })();
    </script>
</body>
</html>
